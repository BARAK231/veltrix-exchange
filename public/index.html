<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>VELTRIX Exchange</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#060a12;
  --panel:#0b111d;
  --panel2:#101827;
  --border:#1d293b;
  --text:#f3f6fb;
  --muted:#8491a5;
  --blue:#2997ff;
  --green:#19c98b;
  --red:#ff5268;
  --yellow:#f5bd4f;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* TOP */

.topbar{
  height:64px;
  border-bottom:1px solid var(--border);
  background:#080d17;
  display:flex;
  align-items:center;
  padding:0 18px;
  gap:24px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:23px;
  font-weight:900;
  letter-spacing:1px;
  white-space:nowrap;
}

.logo span{
  color:var(--blue);
}

.nav{
  display:flex;
  gap:8px;
}

.nav button{
  background:transparent;
  border:0;
  color:#aeb9ca;
  padding:9px 12px;
  border-radius:7px;
}

.nav button:hover,
.nav button.active{
  color:#fff;
  background:#111b2b;
}

.top-search{
  margin-left:auto;
  width:220px;
  position:relative;
}

.top-search input{
  width:100%;
  background:#0e1624;
  border:1px solid var(--border);
  color:#fff;
  border-radius:8px;
  padding:9px 12px 9px 35px;
  outline:none;
}

.top-search span{
  position:absolute;
  left:12px;
  top:9px;
  color:var(--muted);
}

.account{
  display:flex;
  align-items:center;
  gap:8px;
}

.login-btn,
.register-btn{
  border:0;
  border-radius:7px;
  padding:9px 15px;
  font-weight:700;
}

.login-btn{
  background:transparent;
  color:#fff;
}

.register-btn{
  background:var(--blue);
  color:#fff;
}

/* MARKET */

.marketbar{
  min-height:55px;
  background:#080d17;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:7px 18px;
  gap:24px;
  overflow-x:auto;
}

.pair-selector{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:155px;
}

.pair-symbol{
  font-size:19px;
  font-weight:800;
}

.star{
  color:var(--yellow);
  font-size:19px;
}

.market-stat{
  min-width:90px;
}

.market-stat small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:3px;
}

.market-stat strong{
  font-size:13px;
}

.green{
  color:var(--green)!important;
}

.red{
  color:var(--red)!important;
}

/* MAIN */

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  min-height:calc(100vh - 119px);
}

.left{
  min-width:0;
  border-right:1px solid var(--border);
}

/* CHART */

.chart-header{
  height:45px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:16px;
  overflow-x:auto;
}

.time{
  background:transparent;
  border:0;
  color:var(--muted);
  font-size:12px;
}

.time.active,
.time:hover{
  color:#fff;
}

.chart-area{
  height:430px;
  background:
    linear-gradient(
      rgba(35,49,69,.25) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(35,49,69,.25) 1px,
      transparent 1px
    );
  background-size:70px 55px;
  position:relative;
  overflow:hidden;
}

#chartCanvas{
  width:100%;
  height:100%;
  display:block;
}

.chart-label{
  position:absolute;
  top:15px;
  left:18px;
  color:var(--muted);
  font-size:12px;
  z-index:2;
}

.chart-status{
  position:absolute;
  right:18px;
  top:15px;
  color:#536176;
  font-size:10px;
  z-index:2;
}

/* BOOK */

.book{
  border-top:1px solid var(--border);
  background:var(--panel);
}

.section-title{
  height:45px;
  display:flex;
  align-items:center;
  padding:0 15px;
  font-weight:700;
  border-bottom:1px solid var(--border);
}

.book-head,
.book-row{
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr;
  padding:0 15px;
  gap:10px;
}

.book-head{
  color:var(--muted);
  font-size:10px;
  padding-top:10px;
  padding-bottom:7px;
}

.book-row{
  font-size:11px;
  height:24px;
  align-items:center;
}

.ask-price{
  color:var(--red);
}

.bid-price{
  color:var(--green);
}

.spread{
  padding:8px 15px;
  border-top:1px solid #172235;
  border-bottom:1px solid #172235;
  color:var(--yellow);
  font-size:11px;
}

/* RIGHT */

.right{
  background:var(--panel);
  min-width:0;
}

.trade-tabs{
  display:flex;
  border-bottom:1px solid var(--border);
}

.trade-tab{
  flex:1;
  padding:15px 8px;
  background:transparent;
  border:0;
  color:var(--muted);
  font-weight:700;
}

.trade-tab.active{
  color:#fff;
  border-bottom:2px solid var(--blue);
}

.order-type{
  display:flex;
  gap:18px;
  padding:16px;
  border-bottom:1px solid var(--border);
}

.order-type button{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:13px;
}

.order-type button.active{
  color:#fff;
}

.order-form{
  padding:15px;
}

.balance{
  color:var(--muted);
  font-size:11px;
  margin-bottom:14px;
}

.input-wrap{
  position:relative;
  margin-bottom:10px;
}

.input-wrap input{
  width:100%;
  background:#080e18;
  border:1px solid var(--border);
  color:#fff;
  padding:13px 65px 13px 12px;
  border-radius:7px;
  outline:none;
}

.input-wrap input:focus{
  border-color:#2a7bd1;
}

.input-label{
  position:absolute;
  right:12px;
  top:12px;
  color:var(--muted);
  font-size:12px;
}

.percent{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin:12px 0;
}

.percent button{
  background:#101827;
  border:1px solid var(--border);
  color:var(--muted);
  border-radius:5px;
  padding:5px;
  font-size:10px;
}

.trade-btn{
  width:100%;
  border:0;
  border-radius:7px;
  color:#fff;
  font-weight:800;
  padding:13px;
  margin-top:8px;
}

.buy-btn{
  background:var(--green);
}

.sell-btn{
  background:var(--red);
}

.login-required{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:12px;
}

/* BOTTOM */

.bottom{
  border-top:1px solid var(--border);
  background:var(--panel);
  min-height:260px;
}

.bottom-tabs{
  height:48px;
  display:flex;
  gap:24px;
  align-items:center;
  padding:0 16px;
  border-bottom:1px solid var(--border);
  overflow-x:auto;
}

.bottom-tabs button{
  background:transparent;
  border:0;
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}

.bottom-tabs button.active{
  color:#fff;
}

.bottom-content{
  padding:20px 16px;
  color:var(--muted);
  font-size:12px;
  overflow-x:auto;
}

.table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

.table th,
.table td{
  text-align:left;
  padding:11px 8px;
  border-bottom:1px solid #121d2c;
}

.table th{
  color:#6e7b8e;
  font-weight:500;
}

.cancel-btn{
  border:1px solid #3a2330;
  background:#17101a;
  color:var(--red);
  padding:5px 9px;
  border-radius:5px;
  font-size:10px;
}

/* MOBILE */

.mobile-nav{
  display:none;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:390px;
  max-width:100%;
  background:#0c1421;
  border:1px solid var(--border);
  border-radius:13px;
  padding:24px;
  box-shadow:0 20px 80px rgba(0,0,0,.5);
}

.modal-title{
  font-size:21px;
  font-weight:800;
  margin-bottom:20px;
}

.modal-box input{
  width:100%;
  background:#080e18;
  border:1px solid var(--border);
  color:#fff;
  padding:13px;
  border-radius:7px;
  margin-bottom:10px;
  outline:none;
}

.modal-action{
  width:100%;
  background:var(--blue);
  border:0;
  color:#fff;
  padding:13px;
  border-radius:7px;
  font-weight:800;
  margin-top:5px;
}

.modal-switch{
  margin-top:16px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

.modal-switch button{
  border:0;
  background:transparent;
  color:var(--blue);
}

.close-modal{
  float:right;
  background:transparent;
  border:0;
  color:var(--muted);
  font-size:22px;
}

.status{
  margin-top:10px;
  font-size:12px;
  color:var(--muted);
}

.info-box{
  background:#0a1320;
  border:1px solid var(--border);
  padding:12px;
  border-radius:7px;
  margin-bottom:12px;
  line-height:1.6;
}

.market-button{
  background:transparent;
  color:#78859a;
  border:1px solid #1d293b;
  border-radius:6px;
  padding:7px 9px;
  font-size:10px;
  white-space:nowrap;
}

.market-button.active{
  background:#14243a;
  color:#fff;
}

/* MOBILE */

@media(max-width:850px){

  .topbar{
    height:57px;
    padding:0 12px;
    gap:10px;
  }

  .logo{
    font-size:19px;
  }

  .nav{
    display:none;
  }

  .top-search{
    width:130px;
  }

  .login-btn{
    display:none;
  }

  .register-btn{
    padding:8px 10px;
    font-size:11px;
  }

  .marketbar{
    min-height:50px;
    padding:5px 12px;
    gap:15px;
  }

  .market-stat{
    min-width:70px;
  }

  .layout{
    display:block;
  }

  .left{
    border-right:0;
  }

  .chart-area{
    height:300px;
  }

  .right{
    border-top:1px solid var(--border);
  }

  .bottom{
    margin-bottom:62px;
  }

  .mobile-nav{
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:62px;
    background:#080d17;
    border-top:1px solid var(--border);
    z-index:200;
    justify-content:space-around;
  }

  .mobile-nav button{
    flex:1;
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:10px;
  }

  .mobile-nav button.active{
    color:var(--blue);
  }

}

</style>
</head>

<body>

  </div>

<section class="marketbar">

    </span>

  </div>

  <div class="chart-area">

    <div class="chart-label">
      <span id="chartPair">
        BTC/USDT
      </span>

    </div>

    <div class="chart-status"
         id="chartStatus">

  <section class="book">

    <div class="section-title">

    </div>

</main>

          onclick="mobileSection('markets')">

  </button>

  </button>

    Assets
  </button>

        Don't have an account?
      </span>

        Register
      </button>

    </div>

    <div class="status"
         id="authStatus">
    </div>

  </div>

</div>

<script>

/* =========================================================
   CONFIG
========================================================= */

const API = "";

const pairs = [
  "BTC/USDT",
  "ETH/USDT",
  "SOL/USDT",
  "XRP/USDT",
  "TON/USDT",
  "SHIB/USDT",
  "VLX/USDT"
];

let currentPair = "BTC/USDT";
let currentSide = "buy";
let currentOrderType = "limit";
let currentInterval = "1m";

let currentUser = null;
let balances = [];
let candles = [];

/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

async function api(url,options={}){

  const response =
    await fetch(
      API + url,
      {
        credentials:"include",
        headers:{
          "Content-Type":"application/json",
          ...(options.headers || {})
        },
        ...options
      }
    );

  let data = {};

  try{
    data = await response.json();
  }catch{}

  if(!response.ok){

    throw new Error(
      data.error ||
      data.message ||
      "Request failed"
    );

  }

  return data;
}

function formatNumber(value,decimals=8){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return "--";
  }

  const n = Number(value);

  if(!Number.isFinite(n)){
    return "--";
  }

  return n.toLocaleString(
    undefined,
    {
      maximumFractionDigits:decimals
    }
  );
}

function baseAsset(){
  return currentPair.split("/")[0];
}

function quoteAsset(){
  return currentPair.split("/")[1];
}

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* =========================================================
   AUTH
========================================================= */

let authMode = "login";

function openAuth(mode="login"){

  authMode = mode;

  $("authModal")
    .classList.add("show");

  updateAuthModal();
}

function closeAuth(){

  $("authModal")
    .classList.remove("show");

}

function switchAuth(){

  authMode =
    authMode === "login"
      ? "register"
      : "login";

  updateAuthModal();
}

function updateAuthModal(){

  if(authMode === "login"){

    $("authTitle").textContent =
      "Login";

    $("authButton").textContent =
      "Login";

    $("registerFields")
      .style.display = "none";

    $("switchText").textContent =
      "Don't have an account?";

  }else{

    $("authTitle").textContent =
      "Create VELTRIX Account";

    $("authButton").textContent =
      "Create Account";

    $("registerFields")
      .style.display = "block";

    $("switchText").textContent =
      "Already have an account?";

  }

  $("authStatus").textContent = "";

}

async function submitAuth(){

      .value
      .trim();

  const password =
    $("passwordInput")
      .value;

  const name =
    $("nameInput")
      .value
      .trim();

  if(!email || !password){

    $("authStatus").textContent =
      "Please enter email and password.";

    return;
  }

  try{

    $("authStatus").textContent =
      "Processing...";

    if(authMode === "login"){

      await api(
        "/api/login",
        {
          method:"POST",
          body:JSON.stringify({
            email,
            password
          })
        }
      );

    }else{

      await api(
        "/api/register",
        {
          method:"POST",
          body:JSON.stringify({
            email,
            password,
            displayName:
              name ||
              email.split("@")[0]
          })
        }
      );

    }

    $("emailInput").value = "";
    $("passwordInput").value = "";
    $("nameInput").value = "";

    closeAuth();

    await loadUser();

  }catch(error){

    $("authStatus").textContent =
      error.message;

      data.asks || []

function drawChart(){

  const canvas =
    $("chartCanvas");

  const rect =
    canvas.getBoundingClientRect();

  const ratio =
    window.devicePixelRatio || 1;

  canvas.width =
    Math.max(
      1,
      Math.floor(rect.width * ratio)
    );

  canvas.height =
    Math.max(
      1,
      Math.floor(rect.height * ratio)
    );

  const ctx =
    canvas.getContext("2d");

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  const width =
    rect.width;

  const height =
    rect.height;

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  if(!candles.length){

    ctx.fillStyle =
      "#4c5b70";

    ctx.font =
      "14px Arial";

    ctx.textAlign =
      "center";

    ctx.fillText(
      "Waiting for trades...",
      width / 2,
      height / 2
    );

    return;

  }

  const values =
    candles.flatMap(c => [
      Number(c.high),
      Number(c.low)
    ]);

  let max =
    Math.max(...values);

  let min =
    Math.min(...values);

  if(max === min){

    max += 1;
    min -= 1;

  }

  const padTop = 35;
  const padBottom = 20;
  const padLeft = 10;
  const padRight = 55;

  const chartWidth =
    width - padLeft - padRight;

  const chartHeight =
    height - padTop - padBottom;

  function y(value){

    return padTop +
      (
        (max - value) /
        (max - min)
      ) *
      chartHeight;

  }

  function x(index){

    return padLeft +
      (
        index /
        Math.max(
          candles.length - 1,
          1
        )
      ) *
      chartWidth;

  }

  const step =
    chartWidth /
    Math.max(
      candles.length,
      1
    );

  const candleWidth =
    Math.max(
      2,
      Math.min(
        10,
        step * .65
      )
    );

  candles.forEach(
    (candle,index) => {

      const open =
        Number(candle.open);

      const close =
        Number(candle.close);

      const high =
        Number(candle.high);

      const low =
        Number(candle.low);

      const cx =
        x(index);

      const color =
        close >= open
          ? "#19c98b"
          : "#ff5268";

      ctx.strokeStyle =
        color;

      ctx.fillStyle =
        color;

      ctx.lineWidth = 1;

      ctx.beginPath();

      ctx.moveTo(
        cx,
        y(high)
      );

      ctx.lineTo(
        cx,
        y(low)
      );

      ctx.stroke();

      const top =
        Math.min(
          y(open),
          y(close)
        );

      const bottom =
        Math.max(
          y(open),
          y(close)
        );

      ctx.fillRect(
        cx - candleWidth / 2,
        top,
        candleWidth,
        Math.max(
          1,
          bottom - top
        )
      );

    }
  );

  /*
    Price labels
  */

  ctx.fillStyle =
    "#68758a";

  ctx.font =
    "10px Arial";

  ctx.textAlign =
    "left";

  for(let i=0;i<5;i++){

    const value =
      max -
      (
        (max - min) *
        i /
        4
      );

    ctx.fillText(
      formatNumber(value,8),
      width - 50,
      padTop +
      (
        chartHeight *
        i /
        4
      )
    );

  }

}

function setSide(side){

  currentSide = side;

  $("buyTab")
    .classList.toggle(

}

function setOrderType(type){

  currentOrderType = type;

  $("limitType")
    .classList.toggle(
      "active",
      type === "limit"
    );

  $("marketType")
    .classList.toggle(
      "active",
      type === "market"
    );

  $("priceWrap")
    .style.display =
      type === "limit"
        ? "block"
        : "none";

  $("priceInput").value =
    type === "limit"
      ? $("priceInput").value
      : "";

  updateInputLabels();

  calculateTotal();

}

function updateTradeButton(){

  const action =
    currentSide === "buy"
      ? "Buy"
      : "Sell";

  $("tradeButton").textContent =
    `${action} ${baseAsset()}`;

  $("tradeButton")
    .classList.toggle(
      "buy-btn",
      currentSide === "buy"
    );

  $("tradeButton")
    .classList.toggle(
      "sell-btn",
      currentSide === "sell"
    );

}

function calculateTotal(){

  const first =
    Number(
      $("quantityInput").value
    );

  const price =
    Number(
      $("priceInput").value
    );

  if(
    currentOrderType === "limit" &&
    first > 0 &&
    price > 0
  ){

    $("totalInput").value =
      (
        first * price
      ).toFixed(8);

    return;

  }

  if(
    currentOrderType === "market" &&
    currentSide === "buy"
  ){

    $("totalInput").value =
      first > 0
        ? first.toFixed(8)
        : "";

    return;

  }

  $("totalInput").value =
    "";

}

function setPercent(percent){

  if(!currentUser){

    openAuth("login");

    return;

  }

  const asset =
    currentSide === "buy"
      ? quoteAsset()
      : baseAsset();

  const balance =
    findBalance(asset);

  const available =
    Number(
      balance?.available || 0
    );

  if(
    currentOrderType === "market" &&
    currentSide === "buy"
  ){

    $("quantityInput").value =
      (
        available *
        percent /
        100
      ).toFixed(8);

    calculateTotal();

    return;

  }

  if(currentSide === "buy"){

    const price =
      Number(
        $("priceInput").value
      );

    if(price > 0){

      const quantity =
        (
          available *
          percent /
          100
        ) / price;

      $("quantityInput").value =
        quantity.toFixed(8);

    }

  }else{

    $("quantityInput").value =
      (
        available *
        percent /
        100
      ).toFixed(8);

  }

  calculateTotal();

}

$("priceInput")
  .addEventListener(
    "input",
    calculateTotal
  );

$("quantityInput")
  .addEventListener(
    "input",
    calculateTotal
  );

   SUBMIT ORDER
========================================================= */

async function submitOrder(){

  if(!currentUser){

    openAuth("login");

    return;

  }

  const value =
    Number(
      $("quantityInput").value
    );

  const price =
    Number(
      $("priceInput").value
    );

  if(!value || value <= 0){

    alert(
      currentOrderType === "market" &&
      currentSide === "buy"
        ? "Enter USDT amount."
        : "Enter a valid amount."
    );

    return;

  }

  if(
    currentOrderType === "limit" &&
    (!price || price <= 0)
  ){

    alert(
      "Enter a valid price."
    );

    return;

  }

  const button =
    $("tradeButton");

  button.disabled = true;
  button.textContent =
    "Processing...";

  try{

    const payload = {
      symbol:currentPair,
      side:currentSide,
      orderType:currentOrderType
    };

    if(currentOrderType === "limit"){

      payload.price =
        price;

      payload.quantity =
        value;

    }else{

      if(currentSide === "buy"){

        /*
          Market BUY:
          value is USDT amount.
        */

        payload.quoteAmount =
          value;

        payload.quantity =
          value;

      }else{

        /*
          Market SELL:
          value is base quantity.
        */

        payload.quantity =
          value;

      }

    }

    const result =
      await api(
        "/api/orders",
        {
          method:"POST",
          body:JSON.stringify(payload)
        }
      );

    $("quantityInput").value = "";
    $("totalInput").value = "";

    await Promise.all([
      loadBalances(),
      loadOrderBook(),
      loadMarket(),
      loadCandles(),
      loadOrders()
    ]);

    alert(
      result.order?.status === "filled"
        ? "Trade executed successfully."
        : "Order submitted successfully."
    );

  }catch(error){

    alert(
      error.message
    );

  }finally{

    button.disabled = false;

    updateTradeButton();

  }

}

      encodeURIComponent(id),

      loadBalances(),

    alert(

          )
      );

    button.classList.add("active");

  if(type === "orders"){

    await loadOrders();

  if(type === "assets"){

  if(type === "history"){

    await renderOrderHistory();

  if(type === "trades"){

                  trade.quote_amount,
                  4
                )}
              </td>

              <td>
                ${new Date(
                  trade.created_at
                ).toLocaleString()}
              </td>

            </tr>

          `).join("")}

        </tbody>

      </table>

    `;

  }catch{

    $("bottomContent").innerHTML =
      "Unable to load trade history.";

  }

}

function renderAssets(){

  if(!balances.length){

    $("bottomContent").innerHTML =
      `
      <div class="info-box">
        No assets found.
      </div>
      `;

    return;

  }

  $("bottomContent").innerHTML = `

    <div class="info-box">

      <strong>VELTRIX Wallet</strong><br>

      Balances shown here are internal
      exchange ledger balances.

      <br><br>

      Blockchain deposits and withdrawals
      are not enabled until wallet/network
      infrastructure is connected.

    </div>

    <table class="table">

      <thead>

        <tr>
          <th>Asset</th>
          <th>Available</th>
          <th>Locked</th>
          <th>Total</th>
        </tr>

      </thead>

      <tbody>

        ${balances.map(balance => {

          const available =
            Number(
              balance.available || 0
            );

          const locked =
            Number(
              balance.locked || 0
            );

          return `

            <tr>

              <td>
                <strong>
                  ${escapeHtml(
                    balance.symbol
                  )}
                </strong>
              </td>

              <td>
                ${formatNumber(
                  available
                )}
              </td>

              <td>
                ${formatNumber(
                  locked
                )}
              </td>

              <td>
                ${formatNumber(
                  available + locked
                )}
              </td>

            </tr>

          `;

        }).join("")}

      </tbody>

    </table>

  `;

}

/* =========================================================
   MOBILE
========================================================= */

function mobileSection(section){

  if(section === "trade"){

    $("tradePanel")
      .scrollIntoView({
        behavior:"smooth"
      });

    return;

  }

  if(section === "orders"){

    document
      .querySelector(".bottom")
      .scrollIntoView({
        behavior:"smooth"
      });

    return;

  }

  if(section === "assets"){

    showBottom(
      "assets",
      null
    );

    document
      .querySelector(".bottom")
      .scrollIntoView({
        behavior:"smooth"
      });

  }

}

function scrollToTrade(){

  $("tradePanel")
    .scrollIntoView({
      behavior:"smooth"
    });

}

function showMarketArea(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

/* =========================================================
   SEARCH
========================================================= */

$("marketSearch")
  .addEventListener(
    "input",
    function(){

      const query =
        this.value
          .toUpperCase()
          .trim();

      if(!query){
        return;
      }

      const found =
        pairs.find(
          pair =>
            pair.includes(query)
        );

      if(found){

        selectPair(found);

      }

    }
  );

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  drawChart
);

/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(
  async () => {

    await Promise.all([
      loadOrderBook(),
      loadMarket()
    ]);

  },
  3000
);

setInterval(
  async () => {

    await loadCandles();

  },
  10000
);

setInterval(
  async () => {

    if(currentUser){

      await loadBalances();

      /*
        Don't force bottom tab to change.
        Just refresh current data when needed.
      */

    }

  },
  5000
);

/* =========================================================
   INITIALIZE
========================================================= */

async function initialize(){

  createMarketButtons();

  updatePairUI();

  await loadUser();

  await Promise.all([
    loadOrderBook(),
    loadMarket(),
    loadCandles()
  ]);

}

initialize();

</script>
