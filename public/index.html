<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#070b14">
<title>VELTRIX Exchange</title>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#070b14;
  --panel:#0b111d;
  --panel2:#0e1624;
  --border:#1b2638;
  --text:#eef4ff;
  --muted:#8995aa;
  --blue:#318df5;
  --green:#18c58b;
  --red:#ef5350;
  --yellow:#f3c95b;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* TOP */
.topbar{
  height:72px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:26px;
  padding:0 22px;
  background:#080d17;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:-1px;
  white-space:nowrap;
}

.logo span{
  color:var(--blue);
}

.nav{
  display:flex;
  gap:24px;
}

.nav button{
  background:none;
  border:0;
  color:var(--muted);
  font-weight:600;
}

.nav button.active,
.nav button:hover{
  color:#fff;
}

.search{
  margin-left:auto;
  position:relative;
}

.search input{
  width:220px;
  height:42px;
  border:1px solid var(--border);
  background:#0c1421;
  color:#fff;
  border-radius:10px;
  padding:0 14px 0 40px;
  outline:none;
}

.search-icon{
  position:absolute;
  left:14px;
  top:11px;
  color:var(--muted);
}

.account-btn{
  height:42px;
  border:0;
  border-radius:10px;
  background:var(--blue);
  color:#fff;
  font-weight:800;
  padding:0 18px;
}

/* MARKET BAR */
.marketbar{
  border-bottom:1px solid var(--border);
  background:#090f1a;
}

.market-main{
  min-height:92px;
  display:flex;
  align-items:center;
  gap:25px;
  padding:16px 24px;
}

.pair-title{
  font-size:28px;
  font-weight:850;
  white-space:nowrap;
}

.star{
  color:var(--yellow);
  margin-right:10px;
}

.price-block{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.last-price{
  font-size:27px;
  font-weight:800;
}

.change{
  font-size:14px;
  font-weight:700;
}

.green{
  color:var(--green)!important;
}

.red{
  color:var(--red)!important;
}

.market-stats{
  display:flex;
  gap:30px;
  margin-left:25px;
}

.stat{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.stat label{
  color:var(--muted);
  font-size:12px;
}

.stat strong{
  font-size:14px;
}

.pairs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:0 24px 14px;
}

.pair-btn{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:#0c1320;
  color:var(--muted);
  border-radius:9px;
  padding:10px 17px;
}

.pair-btn.active{
  background:#132238;
  border-color:#244363;
  color:#fff;
}

/* TIMEFRAME */
.timebar{
  height:58px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:24px;
  padding:0 25px;
  background:#080e18;
}

.tf{
  background:none;
  border:0;
  color:var(--muted);
  font-weight:600;
}

.tf.active,
.tf:hover{
  color:#fff;
}

.live-status{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--green);
  font-size:13px;
  font-weight:700;
}

.live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px var(--green);
}

/* MAIN */
.workspace{
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  min-height:650px;
}

.left{
  min-width:0;
  border-right:1px solid var(--border);
}

.chart-panel{
  height:510px;
  position:relative;
  background:#070c15;
}

.chart-header{
  position:absolute;
  top:16px;
  left:22px;
  z-index:4;
  color:#9aa6ba;
  font-size:14px;
  pointer-events:none;
}

.chart-price{
  position:absolute;
  top:16px;
  right:22px;
  z-index:4;
  font-weight:800;
  pointer-events:none;
}

#chart{
  position:absolute;
  inset:0;
}

.chart-loading{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#7e8aa0;
  pointer-events:none;
}

.volume-chart{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:95px;
  pointer-events:none;
}

/* ORDERBOOK */
.orderbook{
  background:#090f1a;
  border-top:1px solid var(--border);
}

.section-title{
  padding:22px 25px;
  font-size:21px;
  font-weight:800;
}

.book-head,
.book-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  padding:8px 25px;
  font-size:13px;
}

.book-head{
  color:var(--muted);
  border-top:1px solid var(--border);
}

.book-row{
  cursor:pointer;
}

.book-row:hover{
  background:#0e1725;
}

.book-row span:nth-child(2),
.book-row span:nth-child(3),
.book-head span:nth-child(2),
.book-head span:nth-child(3){
  text-align:right;
}

.asks{
  min-height:150px;
}

.bids{
  min-height:150px;
}

.spread{
  text-align:center;
  padding:11px;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  color:var(--yellow);
  font-size:13px;
}

/* TRADE PANEL */
.trade-panel{
  background:#090f1a;
  padding:20px;
}

.trade-tabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.side-btn{
  flex:1;
  height:42px;
  border:1px solid var(--border);
  background:#0c1421;
  color:var(--muted);
  border-radius:8px;
  font-weight:800;
}

.side-btn.buy.active{
  background:rgba(24,197,139,.12);
  border-color:rgba(24,197,139,.5);
  color:var(--green);
}

.side-btn.sell.active{
  background:rgba(239,83,80,.12);
  border-color:rgba(239,83,80,.5);
  color:var(--red);
}

.order-types{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}

.type-btn{
  border:0;
  background:none;
  color:var(--muted);
  padding:6px 9px;
}

.type-btn.active{
  color:#fff;
  border-bottom:2px solid var(--blue);
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:7px;
}

.input-wrap{
  position:relative;
}

.input-wrap input{
  width:100%;
  height:46px;
  background:#0c1421;
  border:1px solid var(--border);
  border-radius:8px;
  color:#fff;
  padding:0 70px 0 12px;
  outline:none;
}

.input-wrap input:focus{
  border-color:#315a83;
}

.input-unit{
  position:absolute;
  right:12px;
  top:14px;
  color:var(--muted);
  font-size:12px;
}

.percent-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-bottom:14px;
}

.percent-btn{
  border:1px solid var(--border);
  background:#0b1320;
  color:var(--muted);
  border-radius:6px;
  height:30px;
}

.percent-btn:hover{
  color:#fff;
}

.total{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:13px;
  margin:10px 0 14px;
}

.submit-order{
  width:100%;
  height:48px;
  border:0;
  border-radius:9px;
  font-weight:900;
  color:#fff;
}

.submit-order.buy{
  background:var(--green);
}

.submit-order.sell{
  background:var(--red);
}

.login-note{
  color:var(--muted);
  font-size:13px;
  text-align:center;
  padding:10px;
}

/* BOTTOM */
.bottom{
  border-top:1px solid var(--border);
  background:#090f1a;
}

.bottom-tabs{
  display:flex;
  gap:35px;
  padding:0 26px;
  border-bottom:1px solid var(--border);
}

.bottom-tab{
  border:0;
  background:none;
  color:var(--muted);
  padding:19px 0;
}

.bottom-tab.active{
  color:#fff;
  border-bottom:2px solid var(--blue);
}

.bottom-content{
  padding:25px;
  min-height:170px;
}

.empty{
  background:#0a1421;
  border:1px solid var(--border);
  border-radius:10px;
  padding:30px;
  text-align:center;
  color:var(--muted);
}

/* MOBILE */
.mobile-nav{
  display:none;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.modal-card{
  width:min(430px,100%);
  background:#0c1421;
  border:1px solid var(--border);
  border-radius:16px;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-close{
  background:none;
  border:0;
  color:var(--muted);
  font-size:25px;
}

.modal-input{
  width:100%;
  height:47px;
  background:#080f19;
  border:1px solid var(--border);
  border-radius:8px;
  color:#fff;
  padding:0 13px;
  outline:none;
  margin-bottom:12px;
}

.modal-submit{
  width:100%;
  height:47px;
  border:0;
  border-radius:8px;
  background:var(--blue);
  color:#fff;
  font-weight:800;
}

.modal-switch{
  text-align:center;
  margin-top:15px;
  color:var(--muted);
  font-size:13px;
}

.modal-switch button{
  border:0;
  background:none;
  color:var(--blue);
}

/* TOAST */
.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:200;
  background:#111b2a;
  border:1px solid var(--border);
  color:#fff;
  border-radius:10px;
  padding:13px 17px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  max-width:350px;
}

@media(max-width:900px){
  .topbar{
    height:62px;
    padding:0 14px;
    gap:12px;
  }

  .logo{
    font-size:22px;
  }

  .nav{
    display:none;
  }

  .search{
    margin-left:auto;
  }

  .search input{
    width:150px;
  }

  .market-main{
    overflow-x:auto;
    padding:14px;
  }

  .market-stats{
    margin-left:0;
    gap:18px;
  }

  .workspace{
    grid-template-columns:1fr;
  }

  .left{
    border-right:0;
  }

  .trade-panel{
    border-top:1px solid var(--border);
  }

  .chart-panel{
    height:430px;
  }

  .bottom-tabs{
    overflow-x:auto;
    gap:28px;
  }

  .mobile-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:65px;
    background:#080d17;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-around;
    z-index:60;
  }

  .mobile-nav button{
    border:0;
    background:none;
    color:var(--muted);
    font-size:12px;
  }

  .mobile-nav button.active{
    color:var(--blue);
  }

  body{
    padding-bottom:65px;
  }
}

@media(max-width:500px){
  .account-btn{
    padding:0 12px;
  }

  .search input{
    width:125px;
  }

  .pair-title{
    font-size:22px;
  }

  .last-price{
    font-size:21px;
  }

  .market-stats{
    display:none;
  }

  .chart-panel{
    height:390px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">VELTRIX<span>.</span></div>

  <nav class="nav">
    <button class="active">Markets</button>
    <button onclick="scrollToTrade()">Trade</button>
    <button onclick="showBottom('orders')">Orders</button>
    <button onclick="showBottom('assets')">Assets</button>
  </nav>

  <div class="search">
    <span class="search-icon">⌕</span>
    <input id="marketSearch" placeholder="Search market..." autocomplete="off">
  </div>

  <button class="account-btn" id="accountBtn" onclick="openAuth()">
    LOGIN
  </button>
</header>

<section class="marketbar">

  <div class="market-main">

    <div class="pair-title">
      <span class="star">☆</span>
      <span id="pairTitle">BTC/USDT</span>
    </div>

    <div class="price-block">
      <div class="last-price" id="lastPrice">--</div>
      <div class="change" id="change24">--</div>
    </div>

    <div class="market-stats">
      <div class="stat">
        <label>24H HIGH</label>
        <strong id="high24">--</strong>
      </div>

      <div class="stat">
        <label>24H LOW</label>

      <div class="stat">
        <label>24H VOLUME</label>
        <strong id="volume24">--</strong>

    </div>

  </div>

  <div class="pairs" id="pairButtons"></div>

</section>

<div class="timebar">

  <button class="tf" data-timeframe="1m">1m</button>
  <button class="tf active" data-timeframe="5m">5m</button>
  <button class="tf" data-timeframe="15m">15m</button>
  <button class="tf" data-timeframe="1h">1H</button>
  <button class="tf" data-timeframe="4h">4H</button>
  <button class="tf" data-timeframe="1d">1D</button>

</div>

<main class="workspace">

  <section class="left">

    <div class="chart-panel">

      <div class="chart-price" id="chartPrice">--</div>

      </div>

    </div>

    <section class="orderbook">

      <div class="section-title">Order Book</div>

      <div class="book-head">
        <span>Price (USDT)</span>
        <span>Amount</span>
        <span>Total</span>
      </div>

      <div class="asks" id="asks"></div>

      <div class="spread" id="spread">
        Spread: --
      </div>

      <div class="bids" id="bids"></div>

    </section>

  </section>

  <aside class="trade-panel" id="tradePanel">

    <div class="trade-tabs">
      <button class="side-btn buy active" id="buySide" onclick="setSide('buy')">
        BUY
      </button>

      <button class="side-btn sell" id="sellSide" onclick="setSide('sell')">
        SELL
      </button>
    </div>

    <div class="order-types">
      <button class="type-btn active" data-type="limit" onclick="setOrderType('limit')">

    <div id="loginTradeNote" class="login-note hidden">

    <div id="tradeForm">

        <div class="input-wrap">
          <input id="amountInput" type="number" step="any" placeholder="0.00">

      <div class="percent-row">
        <button class="percent-btn" onclick="setPercent(25)">25%</button>
        <button class="percent-btn" onclick="setPercent(50)">50%</button>

        <span>Total</span>

</main>

<section class="bottom">

  <div class="bottom-tabs">

    <button class="bottom-tab active" id="tab-open" onclick="showBottom('open')">
      Open Orders
    </button>

    <button class="bottom-tab" id="tab-orders" onclick="showBottom('orders')">
      Order History
    </button>

    <button class="bottom-tab" id="tab-trades" onclick="showBottom('trades')">
      Trade History
    </button>

    <button class="bottom-tab" id="tab-assets" onclick="showBottom('assets')">
      Assets
    </button>

  </div>

  <div class="bottom-content" id="bottomContent">
    <div class="empty">
      No open orders for BTC/USDT.
    </div>
  </div>

</section>

<nav class="mobile-nav">

  <button class="active" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    ◈<br>Markets
  </button>

  <button onclick="scrollToTrade()">
    ⇄<br>Trade
  </button>

  <button onclick="showBottom('orders')">
    ▤<br>Orders
  </button>

  <button onclick="showBottom('assets')">
    ◇<br>Assets
  </button>

  <button onclick="openAuth()">
    ◎<br>Account
  </button>

</nav>

<!-- AUTH -->
<div class="modal hidden" id="authModal">

  <div class="modal-card">

    <div class="modal-head">
      <h2 id="authTitle">Login</h2>

      <button class="modal-close" onclick="closeAuth()">×</button>
    </div>

    <input class="modal-input" id="authEmail" type="email" placeholder="Email">

    <input class="modal-input" id="authPassword" type="password" placeholder="Password">

    <input class="modal-input hidden" id="authName" type="text" placeholder="Display name">

    <button class="modal-submit" onclick="submitAuth()" id="authSubmit">
      Login
    </button>

    <div class="modal-switch">
      <span id="switchText">Don't have an account?</span>

      <button onclick="toggleAuthMode()" id="switchBtn">
        Register
      </button>
    </div>

  </div>

</div>

<div class="toast hidden" id="toast"></div>

<script>
/* =========================================================
   VELTRIX EXCHANGE FRONTEND
   Live chart + orderbook + trading UI
   ========================================================= */

const API = "";

const MARKETS = [
  "BTC/USDT",
  "ETH/USDT",
  "SOL/USDT",
  "XRP/USDT",
  "TON/USDT",
  "SHIB/USDT",
  "VLX/USDT"
];

const BINANCE_SYMBOLS = {
  "BTC/USDT":"btcusdt",
  "ETH/USDT":"ethusdt",
  "SOL/USDT":"solusdt",
  "XRP/USDT":"xrpusdt",
  "TON/USDT":"tonusdt",
  "SHIB/USDT":"shibusdt"
};

const state = {
  pair:"BTC/USDT",
  timeframe:"5m",
  side:"buy",
  orderType:"limit",
  user:null,
  balances:[],
  chart:null,
  candleSeries:null,
  volumeSeries:null,
  socket:null,
  chartSocket:null,
  candles:[],
  lastPrice:null,
  currentBook:null
};

/* =========================
   BASIC HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatNumber(value, digits=8){
  const n = Number(value);

  if(!Number.isFinite(n)){
    return "--";
  }

  if(Math.abs(n) >= 1000){
    return n.toLocaleString("en-US",{
      maximumFractionDigits:2
    });
  }

  return n.toLocaleString("en-US",{
    maximumFractionDigits:digits
  });
}

function toast(message){
  const el = $("toast");

  el.textContent = message;
  el.classList.remove("hidden");

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(()=>{
    el.classList.add("hidden");
  },3500);
}

/* =========================
   API
========================= */

async function api(path, options={}){
  const response = await fetch(API + path,{
    credentials:"include",
    headers:{
      "Content-Type":"application/json",
      ...(options.headers || {})
    },
    ...options
  });

  let data = null;

  try{
    data = await response.json();
  }catch{
    data = {
      ok:false,
      error:"Invalid server response"
    };
  }

  if(!response.ok){
    throw new Error(data.error || data.message || `HTTP ${response.status}`);
  }

  return data;
}

/* =========================
   MARKET BUTTONS
========================= */

function renderPairs(){

function timeframeToBinance(tf){
  return tf;
}

async function loadChart(){

  $("chartLoading").classList.remove("hidden");

  const binanceSymbol = BINANCE_SYMBOLS[state.pair];

  if(binanceSymbol){

    try{

      const interval = timeframeToBinance(state.timeframe);

      const url =
        "https://api.binance.com/api/v3/klines" +
        `?symbol=${binanceSymbol.toUpperCase()}` +
        `&interval=${interval}` +
        `&limit=500`;

      const response = await fetch(url);

      if(!response.ok){
        throw new Error("Live market unavailable");
      }

      const rows = await response.json();

      const candles = rows.map(row=>({
        time:Math.floor(Number(row[0])/1000),
        open:Number(row[1]),
        high:Number(row[2]),
        low:Number(row[3]),
        close:Number(row[4])
      }));

      const volumes = rows.map(row=>({
        time:Math.floor(Number(row[0])/1000),
        value:Number(row[5]),
        color:Number(row[4]) >= Number(row[1])
          ? "rgba(24,197,139,.45)"
          : "rgba(239,83,80,.45)"
      }));

      state.candles = candles;

      state.candleSeries.setData(candles);
      state.volumeSeries.setData(volumes);

      state.chart.timeScale().fitContent();

      $("chartLoading").classList.add("hidden");

      connectBinanceChart();

      loadBinanceTicker();

      return;

    }catch(error){

      console.error(error);

      $("chartLoading").textContent =
        "Live market connection unavailable";

    }

  }else{

    await loadVLXChart();

  }
}

/* =========================
   VLX INTERNAL CHART
========================= */

async function loadVLXChart(){

  try{

    const data = await api(
      "/api/trades/" +
      encodeURIComponent(state.pair)
    );

    const trades = Array.isArray(data.trades)
      ? data.trades
      : [];

    if(!trades.length){

      $("chartLoading").textContent =
        "No VLX trades yet";

      return;
    }

    const grouped = {};

    trades.reverse().forEach(trade=>{

      const timestamp =
        Math.floor(
          new Date(trade.created_at || trade.createdAt).getTime()
          / 1000
        );

      const bucket =
        Math.floor(timestamp / timeframeSeconds(state.timeframe))
        * timeframeSeconds(state.timeframe);

      const price = Number(trade.price);
      const qty = Number(trade.quantity);

      if(!Number.isFinite(price)){
        return;
      }

      if(!grouped[bucket]){

        grouped[bucket] = {
          time:bucket,
          open:price,
          high:price,
          low:price,
          close:price,
          volume:0
        };

      }else{

        grouped[bucket].high =
          Math.max(grouped[bucket].high,price);

        grouped[bucket].low =
          Math.min(grouped[bucket].low,price);

        grouped[bucket].close = price;

      }

      grouped[bucket].volume +=
        Number.isFinite(qty) ? qty : 0;

    });

    const candles =
      Object.values(grouped)
      .sort((a,b)=>a.time-b.time);

    state.candleSeries.setData(
      candles.map(c=>({
        time:c.time,
        open:c.open,
        high:c.high,
        low:c.low,
        close:c.close
      }))
    );

    state.volumeSeries.setData(
      candles.map(c=>({
        time:c.time,
        value:c.volume,
        color:c.close >= c.open
          ? "rgba(24,197,139,.45)"
          : "rgba(239,83,80,.45)"
      }))
    );

    state.chart.timeScale().fitContent();

    $("chartLoading").classList.add("hidden");

  }catch(error){

    console.error(error);

    $("chartLoading").textContent =
      "Waiting for VLX trades...";

  }

}

function timeframeSeconds(tf){

  const map = {
    "1m":60,
    "5m":300,
    "15m":900,
    "1h":3600,
    "4h":14400,
    "1d":86400
  };

  return map[tf] || 300;
}

/* =========================
   BINANCE LIVE CHART
========================= */

function connectBinanceChart(){

  if(state.chartSocket){
    try{
      state.chartSocket.close();
    }catch{}
  }

  const symbol =
    BINANCE_SYMBOLS[state.pair];

  if(!symbol){
    return;
  }

  const stream =
    symbol.toLowerCase() +
    "@kline_" +
    state.timeframe;

  const url =
    "wss://stream.binance.com:9443/ws/" +
    stream;

  state.chartSocket =
    new WebSocket(url);

  state.chartSocket.onopen = ()=>{
    console.log("Live chart connected:",state.pair,state.timeframe);
  };

  state.chartSocket.onmessage = event=>{

    try{

      const message = JSON.parse(event.data);

      if(!message.k){
        return;
      }

      const k = message.k;

      const candle = {
        time:Math.floor(Number(k.t)/1000),
        open:Number(k.o),
        high:Number(k.h),
        low:Number(k.l),
        close:Number(k.c)
      };

      state.candleSeries.update(candle);

      state.volumeSeries.update({
        time:candle.time,
        value:Number(k.v),
        color:candle.close >= candle.open
          ? "rgba(24,197,139,.45)"
          : "rgba(239,83,80,.45)"
      });

      state.lastPrice = candle.close;

      updatePriceDisplay(candle.close);

      if(message.k.x){
        loadMarketTicker();
      }

    }catch(error){
      console.error("Chart websocket error",error);
    }

  };

  state.chartSocket.onerror = ()=>{
    console.log("Chart websocket error");
  };

  state.chartSocket.onclose = ()=>{
    console.log("Chart websocket closed");

    setTimeout(()=>{

      if(BINANCE_SYMBOLS[state.pair]){
        connectBinanceChart();
      }

    },3000);
  };
}

async function loadBinanceTicker(){

  const symbol =
    BINANCE_SYMBOLS[state.pair];

  if(!symbol){
    return;
  }

  try{

    const response = await fetch(
      "https://api.binance.com/api/v3/ticker/24hr?symbol=" +
      symbol.toUpperCase()
    );

    const data = await response.json();

    updateTicker({
      price:Number(data.lastPrice),
      change:Number(data.priceChangePercent),
      high:Number(data.highPrice),
      low:Number(data.lowPrice),
      volume:Number(data.volume)
    });

  }catch(error){

    console.error(error);

  }
}

function loadMarketTicker(){
  loadBinanceTicker();
}

function updateTicker(data){

  if(!Number.isFinite(data.price)){
    return;
  }

  state.lastPrice = data.price;

  updatePriceDisplay(data.price);

  $("change24").textContent =
    (data.change >= 0 ? "+" : "") +
    data.change.toFixed(2) +
    "%";

  $("change24").className =
    "change " +
    (data.change >= 0 ? "green" : "red");

  $("high24").textContent =
    formatNumber(data.high,8);

  $("low24").textContent =
    formatNumber(data.low,8);

  $("volume24").textContent =
    formatNumber(data.volume,4);
}

function updatePriceDisplay(price){

  $("lastPrice").textContent =
    formatNumber(price,8);

  $("chartPrice").textContent =
    formatNumber(price,8);

  if(
    state.orderType === "limit" &&
    !Number($("priceInput").value)
  ){
    $("priceInput").value =
      Number(price).toString();
  }

  calculateTotal();
}

async function loadOrderBook(){

  try{

    const data = await api(
      "/api/orderbook/" +
      encodeURIComponent(state.pair)
    );

    state.currentBook = data;

    renderOrderBook(data);

  }catch(error){

    console.error("Orderbook:",error);

    $("asks").innerHTML =
      `<div class="empty">Order book unavailable</div>`;

    $("bids").innerHTML = "";

  }
}

function renderOrderBook(data){

  const asks =
    Array.isArray(data.asks)
      ? data.asks
      : [];

  const bids =
    Array.isArray(data.bids)
      ? data.bids
      : [];

  renderBookSide("asks",asks,true);
  renderBookSide("bids",bids,false);

  if(asks.length && bids.length){

    const bestAsk =
      Number(
        Array.isArray(asks[0])
          ? asks[0][0]
          : asks[0].price
      );

    const bestBid =
      Number(
        Array.isArray(bids[0])
          ? bids[0][0]
          : bids[0].price
      );

    if(Number.isFinite(bestAsk) && Number.isFinite(bestBid)){

      $("spread").textContent =
        "Spread: " +
        formatNumber(bestAsk-bestBid,8);

    }

  }else{

    $("spread").textContent =
      "Spread: --";

  }
}

function renderBookSide(id,rows,isAsk){

  const box = $(id);

  if(!rows.length){

    box.innerHTML =
      `<div class="empty">No orders</div>`;

    return;
  }

  const visible =
    rows.slice(0,10);

  box.innerHTML =
    visible.map(row=>{

      const price =
        Array.isArray(row)
          ? Number(row[0])
          : Number(row.price);

      const amount =
        Array.isArray(row)
          ? Number(row[1])
          : Number(row.quantity || row.amount);

      const total =
        price * amount;

      return `
        <div
          class="book-row"
          onclick="useBookPrice(${price})">

          <span class="${isAsk ? "red":"green"}">
            ${formatNumber(price,8)}
          </span>

          <span>
            ${formatNumber(amount,8)}
          </span>

          <span>
            ${formatNumber(total,8)}
          </span>

        </div>
      `;

    }).join("");
}

function useBookPrice(price){

  $("priceInput").value =
    price;

  calculateTotal();
}

function setSide(side){

  state.side = side;

  $("buySide").classList.toggle(
    "active",
    side === "buy"
  );

  $("sellSide").classList.toggle(
    "active",
    side === "sell"
  );

  const button =
    $("submitOrder");

  button.className =
    "submit-order " + side;

  button.textContent =
    (side === "buy" ? "BUY " : "SELL ") +
    state.pair.split("/")[0];

  calculateTotal();
}

function setOrderType(type){

  state.orderType = type;

  document.querySelectorAll(".type-btn")
    .forEach(btn=>{
      btn.classList.toggle(
        "active",
        btn.dataset.type === type
      );
    });

  if(type === "market"){

    $("priceGroup").classList.add("hidden");

  }else{

    $("priceGroup").classList.remove("hidden");

    if(state.lastPrice){
      $("priceInput").value =
        state.lastPrice;
    }

  }

  calculateTotal();
}

function calculateTotal(){

  const amount =
    Number($("amountInput").value || 0);

  let price =
    Number($("priceInput").value || 0);

  if(state.orderType === "market"){
    price = Number(state.lastPrice || 0);
  }

  const total =
    amount * price;

  $("totalValue").textContent =
    formatNumber(total,8) + " USDT";
}

$("amountInput").addEventListener(
  "input",
  calculateTotal
);

$("priceInput").addEventListener(
  "input",
  calculateTotal
);

function setPercent(percent){

  if(!state.user){

    openAuth();

    return;
  }

  const base =
    state.pair.split("/")[0];

  const quote =
    state.pair.split("/")[1];

  const balance =
    state.balances.find(
      b=>String(b.symbol).toUpperCase() ===
      String(
        state.side === "buy"
          ? quote
          : base
      ).toUpperCase()
    );

  if(!balance){

    toast("No available balance.");

    return;
  }

  const available =
    Number(balance.available || 0);

  if(state.side === "sell"){

    $("amountInput").value =
      available * percent / 100;

  }else{

    let price =
      state.orderType === "market"
        ? Number(state.lastPrice || 0)
        : Number($("priceInput").value || 0);

    if(price <= 0){

      toast("Enter a valid price first.");

      return;
    }

    $("amountInput").value =
      (available * percent / 100) / price;

  }

  calculateTotal();
}

/* =========================
   SUBMIT ORDER
========================= */

async function submitOrder(){

  if(!state.user){

    openAuth();

    return;
  }

  const amount =
    Number($("amountInput").value);

  const price =
    state.orderType === "market"
      ? null
      : Number($("priceInput").value);

  if(!Number.isFinite(amount) || amount <= 0){

    toast("Enter a valid amount.");

    return;
  }

  if(
    state.orderType === "limit" &&
    (!Number.isFinite(price) || price <= 0)
  ){

    toast("Enter a valid price.");

    return;
  }

  const button =
    $("submitOrder");

  const oldText =
    button.textContent;

  button.disabled = true;
  button.textContent = "PLACING...";

  try{

    const response =
      await api("/api/orders",{
        method:"POST",

        body:JSON.stringify({

          symbol:state.pair,

          side:state.side,

          orderType:state.orderType,

          price:price,

          quantity:amount

        })

      });

    toast(
      response.message ||
      "Order placed successfully."
    );

    $("amountInput").value = "";

    calculateTotal();

    await loadOrderBook();

    await loadBalances();

    await loadOrders();

  }catch(error){

    toast(error.message);

  }finally{

    button.disabled = false;
    button.textContent = oldText;

  }
}

let authMode = "login";

function openAuth(mode="login"){

  authMode = mode;

  updateAuthModal();

  $("authModal").classList.remove("hidden");
}

function closeAuth(){

  $("authModal").classList.add("hidden");

}

function toggleAuthMode(){

  authMode =
    authMode === "login"
      ? "register"
      : "login";

  updateAuthModal();

}

function updateAuthModal(){

  const register =
    authMode === "register";

  $("authTitle").textContent =
    register ? "Create Account" : "Login";

  $("authSubmit").textContent =
    register ? "Register" : "Login";

  $("authName").classList.toggle(
    "hidden",
    !register
  );

  $("switchText").textContent =
    register
      ? "Already have an account?"
      : "Don't have an account?";

  $("switchBtn").textContent =
    register
      ? "Login"
      : "Register";

}

async function submitAuth(){

  const email =
    $("authEmail").value.trim();

  const password =
    $("authPassword").value;

  const displayName =
    $("authName").value.trim();

  if(!email || !password){

    toast("Email and password are required.");

    return;
  }

  try{

    const endpoint =
      authMode === "register"
        ? "/api/auth/register"
        : "/api/auth/login";

    const body =
      authMode === "register"
        ? {
            email,
            password,
            displayName:
              displayName ||
              email.split("@")[0]
          }
        : {
            email,
            password
          };

    const data =
      await api(endpoint,{
        method:"POST",
        body:JSON.stringify(body)
      });

    state.user =
      data.user ||
      data.account ||
      null;

    closeAuth();

    updateAccountUI();

    toast(
      authMode === "register"
        ? "Account created successfully."
        : "Login successful."
    );

    await loadBalances();
    await loadOrders();

  }catch(error){

    toast(error.message);

  }

}

  }catch{

}

function renderOpenOrders(orders){

  const open =
    orders.filter(
      o =>
        o.status === "open" ||
        o.status === "partially_filled"
    );

  if(!open.length){

    $("bottomContent").innerHTML =
      `<div class="empty">
        No open orders for ${escapeHtml(state.pair)}.
      </div>`;

    return;
  }

  $("bottomContent").innerHTML =
    open.map(order=>`

      <div class="empty" style="margin-bottom:10px;text-align:left">

        <strong class="${order.side === "buy" ? "green":"red"}">
          ${String(order.side).toUpperCase()}
        </strong>

        &nbsp; ${escapeHtml(order.symbol)}

        <br>

        Price:
        ${formatNumber(order.price,8)}

        <br>

        Amount:
        ${formatNumber(order.quantity,8)}

        <br>

        Filled:
        ${formatNumber(order.filled_quantity,8)}

        <br>

        Status:
        ${escapeHtml(order.status)}

        <br><br>

        <button
          onclick="cancelOrder('${order.id}')"
          style="
            background:#ef5350;
            color:#fff;
            border:0;
            border-radius:7px;
            padding:9px 15px;
          ">
          Cancel
        </button>

      </div>

    `).join("");

}

async function cancelOrder(id){

  if(!confirm("Cancel this order?")){
    return;
  }

  try{

    await api(
      "/api/orders/" +
      encodeURIComponent(id),
      {
        method:"DELETE"
      }
    );

    toast("Order cancelled.");

    await loadOrderBook();
    await loadBalances();
    await loadOrders();

  }catch(error){

    toast(error.message);

  }

}

        <div class="empty" style="margin-bottom:10px;text-align:left">

          <strong>
            ${escapeHtml(balance.symbol)}
          </strong>

          <br>

          Available:
          ${formatNumber(balance.available,8)}

          <br>

          Locked:
          ${formatNumber(balance.locked,8)}

        </div>

      `).join("");

    return;
  }

  if(tab === "orders"){

    if(!state.user){

      $("bottomContent").innerHTML =
        `<div class="empty">
          Login to view order history.
        </div>`;

      return;
    }

    try{

      const data =
        await api(
          "/api/orders?symbol=" +
          encodeURIComponent(state.pair)
        );

      const orders =
        Array.isArray(data.orders)
          ? data.orders
          : [];

      const history =
        orders.filter(
          o =>
            o.status !== "open" &&
            o.status !== "partially_filled"
        );

      $("bottomContent").innerHTML =
        history.length
          ? history.map(o=>`

              <div class="empty" style="margin-bottom:10px;text-align:left">

                <strong class="${o.side === "buy" ? "green":"red"}">
                  ${String(o.side).toUpperCase()}
                </strong>

                ${escapeHtml(o.symbol)}

                <br>

                Price:
                ${formatNumber(o.price,8)}

                <br>

                Quantity:
                ${formatNumber(o.quantity,8)}

                <br>

                Status:
                ${escapeHtml(o.status)}

              </div>

            `).join("")
          : `<div class="empty">No order history.</div>`;

    }catch(error){

      toast(error.message);

    }

    return;
  }

  if(tab === "trades"){

    try{

      const data =
        await api(
          "/api/trades/" +
          encodeURIComponent(state.pair)
        );

      const trades =
        Array.isArray(data.trades)
          ? data.trades
          : [];

      $("bottomContent").innerHTML =
        trades.length
          ? trades.slice(0,30).map(t=>`

              <div class="empty" style="margin-bottom:10px;text-align:left">

                <strong>
                  ${formatNumber(t.price,8)}
                </strong>

                <br>

                Amount:
                ${formatNumber(t.quantity,8)}

                <br>

                ${escapeHtml(
                  t.created_at ||
                  t.createdAt ||
                  ""
                )}

              </div>

            `).join("")
          : `<div class="empty">No trades yet.</div>`;

    }catch(error){

      $("bottomContent").innerHTML =
        `<div class="empty">
          Trade history unavailable.
        </div>`;

    }

  }

}

/* =========================
   SEARCH
========================= */

$("marketSearch").addEventListener(
  "input",
  event=>{

    const q =
      event.target.value
      .trim()
      .toUpperCase();

    document.querySelectorAll(".pair-btn")
      .forEach(btn=>{

        btn.style.display =
          !q ||
          btn.dataset.pair
            .toUpperCase()
            .includes(q)
            ? ""
            : "none";

      });

  }
);

/* =========================
   TIMEFRAME
========================= */

document.querySelectorAll(".tf")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        const tf =
          button.dataset.timeframe;

        state.timeframe = tf;

        document.querySelectorAll(".tf")
          .forEach(x=>{
            x.classList.toggle(
              "active",
              x === button
            );
          });

        closeChartSocket();

        resetChart();

        loadChart();

      }
    );

  });

/* =========================
   SOCKET CLEANUP
========================= */

function closeChartSocket(){

  if(state.chartSocket){

    try{
      state.chartSocket.close();
    }catch{}

    state.chartSocket = null;
  }

}

function closeMarketSockets(){

  closeChartSocket();

  if(state.socket){

    try{
      state.socket.close();
    }catch{}

    state.socket = null;
  }

}

/* =========================
   AUTO REFRESH
========================= */

setInterval(()=>{

  loadOrderBook();

  if(state.user){
    loadBalances();
    loadOrders();
  }

},5000);

setInterval(()=>{

  if(BINANCE_SYMBOLS[state.pair]){
    loadBinanceTicker();
  }else{
    loadMarket();
  }

},10000);

/* =========================
   SCROLL
========================= */

function scrollToTrade(){

  $("tradePanel").scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}

/* =========================
   START
========================= */

async function start(){

  renderPairs();

  initChart();

  await loadMe();

  await loadMarket();

  await loadOrderBook();

  if(state.user){

    await loadBalances();

    await loadOrders();

  }

}

start();

</script>

</body>
